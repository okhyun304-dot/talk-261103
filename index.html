<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 대화록</title>
<style>
/* 다글로 스크립트 화면을 따라 만든 대화록 플레이어 */
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#1c1f24; --sub:#7b828c; --line:#e6e9ef; --blue:#2f6bff; --blue2:#e8efff;
  --hl:#fff4c2; --star:#ffb400;
  --a0:#9fb6d9; --a1:#93cdb6; --a2:#e8b7a2; --a3:#c4b0e0; --a4:#e6cf8f; --a5:#9fd3d9; --a6:#d9a3b9; --a7:#b8c48e;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417; --card:#1b1e22; --ink:#e8eaed; --sub:#8f96a0; --line:#2a2e34; --blue:#6f9bff; --blue2:#1f2a44; --hl:#3d3514;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto}
/* ── 목록 화면 (전체 보드) ── */
#home .head{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
#home h1{font-size:24px;font-weight:800;margin:0;flex:1;letter-spacing:-.02em}
#home .sort{color:var(--sub);font-size:14px;text-align:right;padding:6px 20px 4px}
#home .grp{color:var(--sub);font-size:14px;padding:14px 20px 8px}
#home .hsearch{display:flex;align-items:center;gap:8px;margin:6px 16px 4px;background:var(--card);border-radius:14px;padding:0 14px}
#home .hsearch input{flex:1;border:0;background:none;font:inherit;color:inherit;padding:12px 0;outline:none}
#home .hsearch svg{width:18px;height:18px;color:var(--sub)}
.file .n{display:flex;gap:8px;align-items:flex-start}
.file .n .ren{margin-left:auto;color:var(--sub);font-size:15px;padding:0 4px;flex:0 0 auto}
.file.busy{cursor:default;opacity:.75}
.file.busy .k{color:var(--blue)}
.file .hit{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.5}
.file .hit mark{background:var(--hl);color:inherit}
.file{display:block;width:calc(100% - 32px);margin:0 16px 12px;background:var(--card);border:0;border-radius:18px;padding:18px 20px;text-align:left;cursor:pointer}
.file .k{color:var(--sub);font-size:13px;display:flex;align-items:center;gap:6px}
.file .k svg{width:16px;height:16px}
.file .n{font-size:18px;font-weight:700;margin:4px 0 2px;word-break:keep-all}
.file .d{color:var(--sub);font-size:14px}
.file .tags{display:flex;gap:6px;margin-top:12px;overflow:hidden;white-space:nowrap}
.file .tags span{background:var(--bg);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--sub);flex:0 0 auto}
.file .prog{height:3px;background:var(--line);border-radius:2px;margin-top:12px;overflow:hidden}
.file .prog i{display:block;height:100%;background:var(--blue)}
/* ── 스크립트 화면 ── */
#doc{display:none}
.top{position:sticky;top:0;z-index:5;background:var(--card)}
.bar1{display:flex;align-items:center;gap:4px;padding:10px 8px 4px}
.ib{width:42px;height:42px;border:0;background:none;display:grid;place-items:center;cursor:pointer;border-radius:50%;flex:0 0 auto}
.ib:hover{background:var(--bg)}
.ib svg{width:24px;height:24px}
.ttl{flex:1;min-width:0;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:12px 4px 11px;font-size:16px;color:var(--sub);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.cur{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.find{display:none;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.find.on{display:flex}
.find input{flex:1;min-width:0;border:0;background:var(--bg);border-radius:10px;padding:9px 12px;font:15px inherit;color:var(--ink);outline:none}
.find .cnt{color:var(--sub);font-size:13px;min-width:44px;text-align:center}
.find .ib{width:36px;height:36px}
.spk-legend{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
.spk-legend button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 10px 3px 4px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.spk-legend .av{width:20px;height:20px}
.spk-legend .hint{color:var(--sub);font-size:12px;align-self:center}
main{background:var(--card);min-height:100vh;padding:4px 0 170px}
.turn{display:grid;grid-template-columns:44px 1fr;gap:0 12px;padding:14px 18px 10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--a0);position:relative;overflow:hidden;flex:0 0 auto}
.av::before{content:"";position:absolute;left:50%;top:24%;width:36%;height:36%;margin-left:-18%;border-radius:50%;background:#fff;opacity:.92}
.av::after{content:"";position:absolute;left:50%;bottom:-22%;width:76%;height:52%;margin-left:-38%;border-radius:50%;background:#fff;opacity:.92}
.who{display:flex;align-items:baseline;gap:8px;margin:1px 0 4px}
.who b{font-size:16px;cursor:pointer}
.who time{color:var(--sub);font-size:14px;font-variant-numeric:tabular-nums}
.who .clk{color:var(--sub);font-size:12px;opacity:.8}
.tx{font-size:16.5px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
.tx span{cursor:pointer;border-radius:4px;padding:1px 0}
.tx span:hover{background:var(--bg)}
.tx span.on{background:var(--hl)}
.tx span.mk{box-shadow:inset 0 -.55em 0 rgba(255,180,0,.28)}
.tx mark{background:#ffe066;color:#1c1f24;border-radius:3px}
.tx mark.cur{background:#ff9f1a}
.gap{color:var(--sub);font-size:13px;text-align:center;padding:10px 0;margin:0 18px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.empty{color:var(--sub);text-align:center;padding:60px 20px}
/* 북마크 탭 */
.bm{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.bm .w{font-size:13px;color:var(--sub)}
.bm .t{grid-column:1/2}
.bm button{grid-row:1/3;grid-column:2;border:0;background:none;color:var(--sub);cursor:pointer;font-size:13px}
.tools2{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}
.tools2 button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
/* ── 아래 재생 막대 ── */
.player{display:none;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom)}
.player .wrap{padding:0 16px 10px}
.seek{position:relative;height:22px;cursor:pointer;touch-action:none}
.seek .rail{position:absolute;left:0;right:0;top:9px;height:4px;background:var(--line);border-radius:2px}
.seek .fill{position:absolute;left:0;top:9px;height:4px;background:var(--blue);border-radius:2px}
.seek .knob{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue2)}
.times{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums;margin-top:-2px}
.times .c{color:var(--blue)}
.times .t{color:var(--sub)}
.ctl{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;margin-top:4px}
.ctl button{border:0;background:none;height:56px;display:grid;place-items:center;cursor:pointer}
.ctl svg{width:30px;height:30px}
.ctl .rate{font-size:20px;font-weight:600}
.ctl .play svg{width:34px;height:34px}
.ctl .bmk.on svg{fill:var(--star);stroke:var(--star)}
.follow{position:fixed;right:16px;bottom:150px;z-index:6;display:none;border:0;background:var(--ink);color:var(--card);border-radius:99px;padding:9px 14px;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.follow.on{display:block}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{background:var(--card);width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:4px 6px 12px;font-size:17px}
.sheet .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sheet .opts button{border:1px solid var(--line);background:var(--card);border-radius:12px;height:48px;font-size:16px;cursor:pointer}
.sheet .opts button.cur{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:#1c1f24;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.show{opacity:.94}
@media (min-width:761px){ #home .head{padding-top:28px} }
</style>
</head>
<body>

<!-- 전체 보드 -->
<section id="home"><div class="wrap">
  <div class="head"><h1 id="boardTitle"></h1></div>
  <div class="hsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="hq" placeholder="제목·내용 찾기"></div>
  <div class="sort">최신순</div>
  <div class="grp" id="boardSub"></div>
  <div id="files"></div>
</div></section>

<!-- 스크립트 -->
<section id="doc">
  <div class="top"><div class="wrap">
    <div class="bar1">
      <button class="ib" id="backHome" title="목록"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ttl" id="docTitle"></div>
      <button class="ib" id="findBtn" title="찾기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <button class="ib" id="copyBtn" title="스크립트 복사"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg></button>
    </div>
    <div class="find" id="find">
      <input type="search" id="q" placeholder="스크립트에서 찾기">
      <span class="cnt" id="cnt"></span>
      <button class="ib" id="prev" title="이전"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="ib" id="next" title="다음"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="tabs" id="tabs"><button data-t="script" class="cur">스크립트</button><button data-t="marks">북마크</button><button data-t="summary" id="sumTab">요약</button></div>
  </div></div>
  <main><div class="wrap" id="body"></div></main>
</section>

<button class="follow" id="follow">↓ 지금 재생 위치</button>

<div class="player" id="player"><div class="wrap">
  <div class="seek" id="seek"><div class="rail"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
  <div class="times"><span class="c" id="cur">00:00</span><span class="t" id="dur">00:00</span></div>
  <div class="ctl">
    <button class="rate" id="rate" title="재생 속도">1.0x</button>
    <button id="back" title="5초 뒤로 (←)"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 10.5A10 10 0 1 1 6 17"/><path d="M8 5v6h6"/><text x="16" y="21" font-size="10" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif">5</text></svg></button>
    <button class="play" id="play" title="재생 (스페이스)"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg></button>
    <button id="fwd" title="5초 앞으로 (→)"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M23.5 10.5A10 10 0 1 0 26 17"/><path d="M24 5v6h-6"/><text x="16" y="21" font-size="10" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif">5</text></svg></button>
    <button class="bmk" id="bmk" title="지금 줄 북마크"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
  </div>
</div></div>

<div class="sheet" id="sheet"><div class="box"><h3>재생 속도</h3><div class="opts" id="opts"></div></div></div>
<div class="toast" id="toast"></div>
<audio id="au" preload="metadata"></audio>

      const inT = (TT(i) + " " + (tr.tags || []).join(" ")).includes(q);
      const sg = (tr.segs || []).find(x => x[1].includes(q));
      if (!inT && !sg) return;
      if (sg) { const j = sg[1].indexOf(q); hit = '<div class="hit">' + fmt(sg[0]) + " · " + esc(sg[1].slice(Math.max(0, j - 18), j)) + "<mark>" + esc(q) + "</mark>" + esc(sg[1].slice(j + q.length, j + q.length + 30)) + "</div>"; }
    }
    const day = tr.date || DATA.date || "";
    if (day !== last) { out.push('<div class="grp">' + esc(day) + "</div>"); last = day; }
    if (tr.status === "processing" || tr.status === "error") {
      out.push('<div class="file busy"><div class="k">' + (tr.status === "error" ? "처리 실패 — PC 자동기록.log 확인" : "받아 적는 중… (1시간 녹음에 5~10분)") + '</div><div class="n"><span>' + esc(tr.name) + '</span></div><div class="d">' + esc(day + (tr.clock ? " " + tr.clock.slice(0, 5) + " 녹음" : "")) + "</div></div>");
      return;
    }
    const p = store.get("pos:" + K(i), 0), pct = tr.dur ? Math.min(100, p / tr.dur * 100) : 0;
    const nb = Object.keys(marks).filter(k => k.startsWith(K(i) + ":")).length;
    out.push('<button class="file" data-i="' + i + '"><div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>파일 · ' + fmt(tr.dur) + (nb ? " · 북마크 " + nb : "") + '</div>'
      + '<div class="n"><span>' + esc(TT(i)) + '</span><span class="ren" data-ren="' + i + '" aria-label="제목 바꾸기">✎</span></div><div class="d">' + esc(day + (tr.clock ? " " + tr.clock.slice(0, 5) + " 녹음" : "")) + '</div>'
      + (tr.tags && tr.tags.length ? '<div class="tags">' + tr.tags.map(t => "<span>" + esc(t) + "</span>").join("") + "</div>" : "")
      + hit + (pct > 0 ? '<div class="prog"><i style="width:' + pct + '%"></i></div>' : "") + "</button>");
  });
  $("files").innerHTML = out.join("") || '<div class="grp">찾는 녹음이 없습니다.</div>';
}
$("hq").addEventListener("input", renderHome);
$("files").addEventListener("click", e => {
  const r = e.target.closest("[data-ren]");
  if (r) { const i = +r.dataset.ren, v = prompt("녹음 제목", TT(i)); if (v != null) { if (v.trim()) titles[K(i)] = v.trim(); else delete titles[K(i)]; store.set("titles", titles); renderHome(); } return; }
  const b = e.target.closest("button.file"); if (b) openTrack(+b.dataset.i); });
// 휴대폰 뒤로가기: 녹음을 열 때 기록을 하나 쌓고(pushState), 뒤로가기(popstate)면 목록으로
function goHome(fromHistory){
  if (!fromHistory && history.state && history.state.t >= 0) { history.back(); return; }   // 화면의 ← 도 뒤로가기와 똑같이
  if (ti >= 0) store.set("pos:" + K(ti), au.currentTime); au.pause(); $("doc").style.display = "none"; $("player").style.display = "none"; $("follow").classList.remove("on"); $("home").style.display = ""; renderHome();
  if (!fromHistory) history.replaceState({}, "", "#");
}
$("backHome").onclick = () => goHome(false);
window.addEventListener("popstate", e => { const s = e.state || {}; if (s.t >= 0 && DATA.tracks[s.t]) openTrack(s.t, true); else goHome(true); });

// ── 스크립트: 같은 사람이 이어서 말한 줄은 한 덩어리로 (다글로처럼) ──
function turnsOf(tr){
  const out = []; let cur = null;
  tr.segs.forEach((sg, i) => {
    const [t, , spk] = sg;
    if (!cur || cur.spk !== spk || t - tr.segs[i - 1][0] > 25 || cur.idx.length >= 12) { cur = {spk, t, idx: []}; out.push(cur); }
    cur.idx.push(i);
  });
  return out;
}
function renderScript(){
  const tr = DATA.tracks[ti], q = $("q").value.trim();
  const re = q ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  const used = [...new Set(tr.segs.map(s => s[2]).filter(s => s >= 0))].sort((a, b) => a - b);
  let h = used.length ? '<div class="spk-legend">' + used.map(n => '<button data-s="' + n + '">' + av(n) + esc(spkName(n)) + "</button>").join("") + '<span class="hint">이름을 누르면 바꿀 수 있어요</span></div>' : "";
  let prevEnd = null;
  turnsOf(tr).forEach(tn => {
    if (prevEnd !== null && tn.t - prevEnd > 60) h += '<div class="gap">' + fmt(tn.t - prevEnd) + " 동안 말소리 없음 · 잘 안 들림</div>";
    h += '<div class="turn">' + av(tn.spk) + '<div><div class="who"><b data-s="' + tn.spk + '">' + esc(spkName(tn.spk)) + "</b><time>" + fmt(tn.t) + "</time>" + (tr.clock ? '<span class="clk">' + clockAt(tr, tn.t) + "</span>" : "") + '</div><div class="tx">';
    h += tn.idx.map(i => { let s = esc(tr.segs[i][1]); if (re) s = s.replace(re, m => "<mark>" + m + "</mark>"); return '<span data-i="' + i + '"' + (marks[K(ti) + ":" + i] ? ' class="mk"' : "") + ">" + s + "</span>"; }).join(" ");
    h += "</div></div></div>";
    prevEnd = tr.segs[tn.idx[tn.idx.length - 1]][0];
  });
  body.innerHTML = h || '<div class="empty">받아 적은 말이 없습니다.</div>';
  spans = []; body.querySelectorAll(".tx span").forEach(s => spans[+s.dataset.i] = s);
  hits = [...body.querySelectorAll("mark")]; hitAt = -1; $("cnt").textContent = re ? hits.length ? "0/" + hits.length : "없음" : "";
  curIdx = -1; tick(true);
}
function renderMarks(){
  const tr = DATA.tracks[ti];
  const ks = Object.keys(marks).filter(k => k.startsWith(K(ti) + ":")).map(k => +k.split(":")[1]).sort((a, b) => a - b);
  let h = '<div class="tools2"><button id="copyMarks">북마크 복사</button></div>';
  h += ks.length ? ks.map(i => '<div class="bm" data-i="' + i + '"><div class="w">' + esc(spkName(tr.segs[i][2])) + " · " + fmt(tr.segs[i][0]) + (tr.clock ? " · " + clockAt(tr, tr.segs[i][0]) : "") + '</div><div class="t">' + esc(tr.segs[i][1]) + '</div><button data-del="' + i + '">빼기</button></div>').join("")
    : '<div class="empty">재생 중에 아래 <b>북마크</b> 버튼을 누르거나<br>스크립트 문장을 길게 누르면 여기에 모입니다.</div>';
  body.innerHTML = h;
  $("copyMarks").onclick = () => copyText(ks.map(i => "[" + fmt(tr.segs[i][0]) + (tr.clock ? " · " + clockAt(tr, tr.segs[i][0]) : "") + "] " + spkName(tr.segs[i][2]) + ": " + tr.segs[i][1]).join("\n"), ks.length + "줄 복사했습니다");
}
function renderSummary(){
  const tr = DATA.tracks[ti];
  body.innerHTML = tr.summary ? '<div style="padding:18px;white-space:pre-wrap;line-height:1.85">' + esc(tr.summary) + "</div>" : '<div class="empty">아직 요약이 없습니다.</div>';
}
function render(){ ({script: renderScript, marks: renderMarks, summary: renderSummary})[tab](); }
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.t;
  [...$("tabs").children].forEach(x => x.classList.toggle("cur", x === b)); render(); window.scrollTo(0, 0); });

function toggleMark(i){ const k = K(ti) + ":" + i; if (marks[k]) delete marks[k]; else marks[k] = 1; store.set("marks2", marks);
  if (spans[i]) spans[i].classList.toggle("mk", !!marks[k]); toast(marks[k] ? "북마크했습니다" : "북마크를 뺐습니다"); updBmk(); }
// 꾹 누르기(0.6초, 손가락이 거의 안 움직일 때만) = 북마크. 스크롤하려고 글자 위에 손을 댄 경우는 취소
let pressT, pressXY;
const pressCancel = () => { if (pressT !== "long") { clearTimeout(pressT); pressT = null; } };
body.addEventListener("pointerdown", e => { const s = e.target.closest(".tx span"); if (!s) return; pressXY = [e.clientX, e.clientY];
  pressT = setTimeout(() => { pressT = "long"; toggleMark(+s.dataset.i); if (navigator.vibrate) navigator.vibrate(30); }, 600); });
body.addEventListener("pointermove", e => { if (pressXY && Math.hypot(e.clientX - pressXY[0], e.clientY - pressXY[1]) > 8) pressCancel(); });
["pointerup", "pointercancel"].forEach(ev => body.addEventListener(ev, pressCancel));
window.addEventListener("scroll", pressCancel, {passive: true});
body.addEventListener("contextmenu", e => { if (e.target.closest(".tx span")) e.preventDefault(); });
body.addEventListener("click", e => {
  if (pressT === "long") { pressT = null; return; }
  const nameEl = e.target.closest("[data-s]");
  if (nameEl && (nameEl.tagName === "B" || nameEl.closest(".spk-legend"))) {
    const n = +nameEl.dataset.s, v = prompt("이 사람 이름 (이 녹음 묶음에 적용)", spkName(n));
    if (v && v.trim()) { (names[NG()] = names[NG()] || {})[n] = v.trim(); store.set("names2", names); render(); } return;
  }
  const del = e.target.closest("[data-del]"); if (del) { toggleMark(+del.dataset.del); renderMarks(); return; }
  const s = e.target.closest(".tx span, .bm"); if (!s) return;
  seekTo(DATA.tracks[ti].segs[+s.dataset.i][0]); au.play();
});

function openTrack(i, fromHistory){
  $("home").style.display = "none"; $("doc").style.display = "block"; $("player").style.display = "block";
  if (ti !== i || !au.src) {
    if (ti >= 0) store.set("pos:" + K(ti), au.currentTime);
    ti = i; au.src = DATA.tracks[i].src;
    const p = store.get("pos:" + K(i), 0);
    au.addEventListener("loadedmetadata", () => { if (p > 0) au.currentTime = p; setRate(store.get("speed", 1)); }, {once: true});
  }
  store.set("track", i);
  if (!fromHistory) { if (history.state && history.state.t >= 0) history.replaceState({t: i}, "", "#" + i); else history.pushState({t: i}, "", "#" + i); }
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title: TT(i), artist: DATA.title});
  $("docTitle").textContent = TT(i); $("dur").textContent = fmt(DATA.tracks[i].dur);
  $("sumTab").style.display = DATA.tracks.some(t => t.summary) ? "" : "none";
  render(); window.scrollTo(0, 0);
}

// ── 재생 ──
function idxAt(t){ const s = DATA.tracks[ti].segs; let lo = 0, hi = s.length - 1, a = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (s[m][0] <= t + 0.2) { a = m; lo = m + 1; } else hi = m - 1; } return a; }
function following(){ return Date.now() - lastUserScroll > 5000; }
function tick(force){
  if (ti < 0) return;
  const i = idxAt(au.currentTime);
  if (i !== curIdx || force) {
    if (spans[curIdx]) spans[curIdx].classList.remove("on");
    if (spans[i]) { spans[i].classList.add("on");
      if (tab === "script" && !au.paused && following()) { autoScrolling = true; spans[i].scrollIntoView({block: "center", behavior: "smooth"}); setTimeout(() => autoScrolling = false, 700); } }
    curIdx = i; updBmk();
  }
  const d = au.duration || DATA.tracks[ti].dur || 1, p = Math.min(1, au.currentTime / d) * 100;
  if (!dragging) { $("fill").style.width = p + "%"; $("knob").style.left = p + "%"; $("cur").textContent = fmt(au.currentTime); }
  $("follow").classList.toggle("on", tab === "script" && !au.paused && !following());
}
function updBmk(){ $("bmk").classList.toggle("on", curIdx >= 0 && !!marks[K(ti) + ":" + curIdx]); }
function seekTo(t){ au.currentTime = Math.max(0, t); lastUserScroll = 0; tick(true); }
au.addEventListener("timeupdate", () => tick());
au.addEventListener("play", () => $("playIco").innerHTML = PAUSE);
au.addEventListener("pause", () => { $("playIco").innerHTML = PLAY; store.set("pos:" + K(ti), au.currentTime); });
au.addEventListener("error", () => toast("음성 파일을 열 수 없습니다"));
$("play").onclick = () => au.paused ? au.play() : au.pause();
$("back").onclick = () => seekTo(au.currentTime - 5);
$("fwd").onclick = () => seekTo(au.currentTime + 5);
$("bmk").onclick = () => { if (curIdx >= 0) toggleMark(curIdx); };
// 잠금화면·알림창 조작 (화면을 꺼도 계속 재생, 거기서 멈춤·5초 이동)
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession, h = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
  h("play", () => au.play()); h("pause", () => au.pause());
  h("seekbackward", () => seekTo(au.currentTime - 5)); h("seekforward", () => seekTo(au.currentTime + 5));
  h("seekto", d => seekTo(d.seekTime));
}
$("follow").onclick = () => { lastUserScroll = 0; tick(true); if (spans[curIdx]) spans[curIdx].scrollIntoView({block: "center", behavior: "smooth"}); };
["wheel", "touchmove"].forEach(ev => window.addEventListener(ev, () => { if (!autoScrolling) lastUserScroll = Date.now(); }, {passive: true}));

// 진행 막대 끌기
let dragging = false;
function seekFrom(e){ const r = $("seek").getBoundingClientRect(), x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const d = au.duration || DATA.tracks[ti].dur; $("fill").style.width = x * 100 + "%"; $("knob").style.left = x * 100 + "%"; $("cur").textContent = fmt(x * d); return x * d; }
$("seek").addEventListener("pointerdown", e => { dragging = true; $("seek").setPointerCapture(e.pointerId); seekFrom(e); });
$("seek").addEventListener("pointermove", e => { if (dragging) seekFrom(e); });
$("seek").addEventListener("pointerup", e => { if (!dragging) return; dragging = false; seekTo(seekFrom(e)); });

// 속도
SPEEDS.forEach(v => { const b = document.createElement("button"); b.textContent = v + "x"; b.dataset.v = v; b.onclick = () => { setRate(v); $("sheet").classList.remove("on"); }; $("opts").appendChild(b); });
function setRate(v){ au.playbackRate = v; store.set("speed", v); $("rate").textContent = (v % 1 ? v : v.toFixed(1)) + "x";
  [...$("opts").children].forEach(b => b.classList.toggle("cur", +b.dataset.v === v)); }
$("rate").onclick = () => $("sheet").classList.add("on");
$("sheet").onclick = e => { if (e.target === $("sheet")) $("sheet").classList.remove("on"); };

// 찾기
$("findBtn").onclick = () => { $("find").classList.toggle("on"); if ($("find").classList.contains("on")) $("q").focus(); else { $("q").value = ""; render(); } };
let qh; $("q").addEventListener("input", () => { clearTimeout(qh); qh = setTimeout(() => { if (tab !== "script") $("tabs").children[0].click(); else renderScript(); }, 220); });
function jump(d){ if (!hits.length) return; if (hits[hitAt]) hits[hitAt].classList.remove("cur");
  hitAt = (hitAt + d + hits.length) % hits.length; hits[hitAt].classList.add("cur"); lastUserScroll = Date.now();
  hits[hitAt].scrollIntoView({block: "center"}); $("cnt").textContent = (hitAt + 1) + "/" + hits.length; }
$("next").onclick = () => jump(1); $("prev").onclick = () => jump(-1);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); jump(e.shiftKey ? -1 : 1); } });

// 복사
function copyText(txt, msg){ if (!txt) { toast("복사할 내용이 없습니다"); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(msg), () => {
    const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); toast(msg); }); }
$("copyBtn").onclick = () => { const tr = DATA.tracks[ti];
  copyText(turnsOf(tr).map(tn => spkName(tn.spk) + " " + fmt(tn.t) + "\n" + tn.idx.map(i => tr.segs[i][1]).join(" ")).join("\n\n"), "스크립트를 복사했습니다"); };

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || ti < 0 || $("doc").style.display === "none") return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  else if (e.key === "ArrowLeft") $("back").click();
  else if (e.key === "ArrowRight") $("fwd").click();
});

renderHome();
const h0 = parseInt(location.hash.slice(1), 10);
history.replaceState({}, "", "#");                     // 맨 아래 기록 = 목록 (주소에 #번호로 들어와도 뒤로가기하면 목록)
if (!isNaN(h0) && DATA.tracks[h0]) openTrack(h0);
</script>
</body>
</html>
